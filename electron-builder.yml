appId: com.codeholistic.texugo
productName: Texugo
copyright: Copyright © CodeHolistic
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraMetadata:
  main: out/main/index.js
asarUnpack:
  - "**/*.node"
  - "**/node_modules/sql.js/**"
win:
  executableName: Texugo
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: Texugo-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Texugo
  uninstallDisplayName: Texugo
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
npmRebuild: false
